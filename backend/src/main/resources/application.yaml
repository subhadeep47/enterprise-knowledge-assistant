server:
  port: 8080

spring:
  application:
    name: enterprise-assistant-backend

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: openai/gpt-oss-120b

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  frontend-url: ${FRONTEND_URL}

  jwt:
    # Generate a random 256-bit or stronger key and Base64-encode it.
    secret: ${JWT_SECRET}
    expiration-ms: 900000 # 15 minutes

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: Lax

  security:
    admin-email: ${APP_ADMIN_EMAIL}
