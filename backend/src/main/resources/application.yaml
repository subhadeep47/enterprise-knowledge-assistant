server:
  port: 8080

spring:
  application:
    name: enterprise-assistant-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterprise_assistant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  jwt:
    # Generate a random 256-bit or stronger key and Base64-encode it.
    secret: ${JWT_SECRET}
    expiration-ms: 900000 # 15 minutes

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: Lax
